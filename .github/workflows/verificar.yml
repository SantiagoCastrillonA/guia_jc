# Un push a main sale en vivo en ~15 s sin pasar por nadie. Esto al menos deja
# el error en rojo en GitHub: typecheck, lint y build en cada push y cada PR.
name: Verificar

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # El servidor no tiene lockfile ni tests: por ahora solo se comprueba que
      # no haya errores de sintaxis en ningún archivo.
      - name: Revisar sintaxis
        working-directory: server
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
