# nginx de la guía, con HTTPS.
# Vive en /etc/nginx/sites-available/guia-jc (enlazado en sites-enabled).
# El certificado lo emite Let's Encrypt para 3-141-72-146.nip.io — un dominio
# comodín gratuito que resuelve a la IP del servidor, mientras no haya dominio propio.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Excepción al redireccionamiento: GitHub NO sigue redirecciones en los
    # webhooks — si esto respondiera 301, el autodeploy dejaría de funcionar.
    # La petición va firmada con HMAC, así que viajar por HTTP no la expone.
    location = /api/deploy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Todo lo demás se va a HTTPS: las contraseñas de los estudiantes no
    # pueden viajar en claro.
    location / {
        return 301 https://3-141-72-146.nip.io$request_uri;
    }
}

server {
    # nginx 1.24 (Ubuntu 24.04): http2 va en el listen, no como directiva suelta.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 3-141-72-146.nip.io;

    ssl_certificate /etc/letsencrypt/live/3-141-72-146.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3-141-72-146.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/guia-jc;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: cualquier ruta desconocida la resuelve el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
